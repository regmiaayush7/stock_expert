schema_version: "1.1"
name: conflicting-signals
expected_outcome: |
  Names the conflict, defaults to Hold or no action unless expected value is clearly positive, uses fetched NHPC data with a date (EPS about -0.93, price about 259.7), admits the technical view is limited, gives net-of-tax numbers, gives the strongest case against. Technical depth is v1, so partial credit is expected.
  Failure: Confident Accumulate; claims a confirmed breakout; no fetched data.
